workflows:
  ios-cliente:
    name: Lux Transfers - Cliente (iOS)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-cliente
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pt.luxtransfers.lux-cliente
      vars:
        XCODE_WORKSPACE: "Lux.xcworkspace"
        XCODE_SCHEME: "Lux"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  ios-luxdriver:
    name: LuxDriver (iOS)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-luxdriver
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pt.luxtransfers.luxdriver-motorista
      vars:
        XCODE_WORKSPACE: "LuxDriver.xcworkspace"
        XCODE_SCHEME: "LuxDriver"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
